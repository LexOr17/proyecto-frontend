<div class="notification-item" [class.notification-success]="notification().type === 'success'" [class.notification-error]="notification().type === 'error'" [class.notification-warning]="notification().type === 'warning'" [class.notification-info]="notification().type === 'info'" role="alert" [attr.aria-live]="notification().type === 'error' ? 'assertive' : 'polite'">
  <div class="notification-content">
    <span class="notification-icon" aria-hidden="true">{{ icon() }}</span>
    <span class="notification-message">{{ notification().message }}</span>
  </div>
  <button type="button" class="notification-close" (click)="onClose()" aria-label="Cerrar notificación">
    ×
  </button>
</div>
