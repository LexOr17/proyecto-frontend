<aside class="sidebar">
    <div class="sidebar-brand">
        <h2><span class='bx bxl-apple'></span> <span>Bienestar</span></h2>
        <button type="button" class="close-mobile" (click)="closeSidebar()" aria-label="Cerrar menú lateral">
            <span class='bx bx-x' aria-hidden="true"></span>
        </button>
    </div>

    <nav class="sidebar-menu" aria-label="Menú principal">
        <ul>
            <li>
                <a routerLink="/main/dashboard" routerLinkActive="active">
                    <span class='bx bx-grid-alt'></span>
                    <span>Dashboard</span>
                </a>
            </li>
            @if (currentUserRole() === 'ADMINISTRADOR') {
              <li>
                <a routerLink="/main/usuarios/nuevo" routerLinkActive="active">
                  <span class='bx bx-user'></span> 
                  <span>Nuevo Usuario</span>
                </a>
              </li>
              <li>
                <a routerLink="/main/usuarios" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
                  <span class='bx bx-group'></span> 
                  <span>Lista de Usuarios</span>
                </a>
              </li>
            }
            <li>
                <button type="button" class="sidebar-logout" (click)="logout()">
                    <span class='bx bx-log-out' aria-hidden="true"></span>
                    <span>Salir</span>
                </button>
            </li>
        </ul>
    </nav>
</aside>
