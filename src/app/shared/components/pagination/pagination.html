<div class="pagination-container">
  <div class="pagination-header">
    <div class="items-per-page">
      <label for="perPage">Mostrar</label>
      <select id="perPage" (change)="onPageSizeChange($event)">
        @for (option of pageSizeOptions; track option) {
          <option [value]="option" [selected]="option === pageSize()">{{ option }}</option>
        }
      </select>
    </div>

    <div class="pagination-info">
      Mostrando {{ showingFrom() }} - {{ showingTo() }} de {{ totalElements() }} resultados
    </div>
  </div>

  @if (totalPages() > 1) {
    <nav class="pagination" aria-label="Paginación">
      <button type="button"
              class="page-btn nav-btn prev-btn"
              [disabled]="currentPage() === 0"
              (click)="goToPage(currentPage() - 1)"
              aria-label="Página anterior">
        <span>Anterior</span>
      </button>

      @for (page of pages(); track $index) {
        @if (page === '...') {
          <button type="button" class="page-btn dots" disabled aria-hidden="true">...</button>
        } @else {
          <button type="button"
                  class="page-btn"
                  [class.active]="page === currentPage()"
                  [attr.aria-current]="page === currentPage() ? 'page' : null"
                  (click)="goToPage(+page)">
            {{ +page + 1 }}
          </button>
        }
      }

      <button type="button"
              class="page-btn nav-btn next-btn"
              [disabled]="currentPage() === totalPages() - 1"
              (click)="goToPage(currentPage() + 1)"
              aria-label="Página siguiente">
        <span>Siguiente</span>
      </button>
    </nav>
  }
</div>
