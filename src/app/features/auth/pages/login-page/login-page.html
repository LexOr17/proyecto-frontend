<main>

    <div class="shape shape-1" aria-hidden="true"></div>
    <div class="shape shape-2" aria-hidden="true"></div>
    <div class="shape shape-3" aria-hidden="true"></div>

    <div class="login-card">
        <div class="logo-area">
            <img src="/icons/nutri.png" alt="NutriSystem" class="logo-icon">
            <h1>Nutri<span>System</span></h1>
            <p>Plataforma de Salud Integral</p>
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

            <div class="form-group" [class.error]="isInvalid('email')">
                <input type="email" id="email" formControlName="email" class="form-input" placeholder=" "
                    autocomplete="email" [attr.aria-invalid]="isInvalid('email')" aria-describedby="email-error">
                <label for="email" class="form-label">Correo Electrónico</label>

                @if (isInvalid('email')) {
                <span id="email-error" class="error-msg" role="alert">
                    {{ getErrorMessage('email', 'Correo') }}
                </span>
                }
            </div>

            <div class="form-group" [class.error]="isInvalid('password')">
                <input type="password" id="password" formControlName="password" class="form-input" placeholder=" "
                    autocomplete="current-password" [attr.aria-invalid]="isInvalid('password')" aria-describedby="password-error">
                <label for="password" class="form-label">Contraseña</label>

                @if (isInvalid('password')) {
                <span id="password-error" class="error-msg" role="alert">
                    {{ getErrorMessage('password', 'Contraseña') }}
                </span>
                }
            </div>

            <button type="submit" class="submit-btn" [disabled]="isLoading()">
                @if (isLoading()) {
                <span class="spinner"></span> Cargando...
                } @else {
                Iniciar Sesión
                }
            </button>
        </form>

        <div class="forgot-password">
            <a routerLink="../recuperar-password">¿Olvidaste tu contraseña?</a>
        </div>
    </div>

</main>
