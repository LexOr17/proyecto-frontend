<main>

    <div class="recovery-container">
        <!-- Icono de candado o similar para recuperación -->
        <div class="recovery-icon">🔐</div>

        <h1>Recuperar Cuenta</h1>
        <p>Ingresa tu correo electrónico y te enviaremos instrucciones para restablecer tu contraseña.</p>

        <form action="#" method="POST" onsubmit="event.preventDefault(); console.log('Recuperación solicitada');">

            <div class="form-group">
                <input type="email" id="email" name="email" class="form-input" placeholder=" " required
                    autocomplete="email">
                <label for="email" class="form-label">Correo Electrónico</label>
                <span class="error-msg">Por favor ingresa un correo válido</span>
            </div>

            <button type="submit" class="submit-btn">Recuperar cuenta</button>
        </form>

        <div class="back-to-login">
            <a routerLink="/auth/login">
                <span>←</span> Volver al inicio de sesión
            </a>
        </div>
    </div>

</main>
